<script>

const PAIRS = [
  ["stmt", "stmt-data"],
  ["val", "val_data"],
  ["obj-kind", "data"],
  ["lit-val", "lit-val-data"],
  ["bin-op-type", "bin-op-type-data"]
];

function isPlainObject(v) {
  return v && typeof v === "object" && !Array.isArray(v);
}

function simplify(node) {
  if (Array.isArray(node)) return node.map(simplify);
  if (!isPlainObject(node)) return node;

  for (const [tag, dataKey] of PAIRS) {
    if (tag in node && dataKey in node) {
      const inner = simplify(node[dataKey]);

      if (isPlainObject(inner)) {
        return { type: node[tag], ...inner };
      }

      return { type: node[tag], value: inner };
    }
  }

  const out = {};

  for (const [k, v] of Object.entries(node)) {
    if (k === "hash_type") continue;

    const sv = simplify(v);

    if (isPlainObject(sv) && typeof sv.type === "string") {
      out[`${k}_type`] = sv.type;

      for (const [ik, iv] of Object.entries(sv)) {
        if (ik === "type") continue;
        if (ik in out) out[`${k}_${ik}`] = iv;
        else out[ik] = iv;
      }
    } else {
      out[k] = sv;
    }
  }

  return out;
}

const SIMPLIFIED = simplify(DATA);

let current = "raw";
let collapsed = 2;

function render() {
  const src = current === "raw" ? DATA : SIMPLIFIED;

  ReactDOM.render(
    React.createElement(window.reactJsonView.default, {
      src,
      theme: "monokai",
      collapsed,
      displayDataTypes: false,
      enableClipboard: true,
      name: false

}

const rawBtn = document.getElementById("rawBtn");
const simpleBtn = document.getElementById("simpleBtn");
const expandBtn = document.getElementById("expandBtn");
const collapseBtn = document.getElementById("collapseBtn");

rawBtn.onclick = () => {
  current = "raw";
  rawBtn.classList.add("active");
  simpleBtn.classList.remove("active");
  render();
};

simpleBtn.onclick = () => {
  current = "simplified";
  simpleBtn.classList.add("active");
  rawBtn.classList.remove("active");
  render();
};

expandBtn.onclick = () => {
  collapsed = false;
  render();
};

collapseBtn.onclick = () => {
  collapsed = 2;
  render();
};

render();
</script>
